# Publica un release de Anime Watcher en GitHub con los instaladores de Windows y macOS.
#
# Se lanza al subir una etiqueta vX.Y.Z (o X.Y.Z) que coincida con la versión de
# src-tauri/tauri.conf.json, o a mano desde Actions → Publicar release → Run workflow (publica la
# versión de tauri.conf.json de main). El release siempre se etiqueta vX.Y.Z. Compila con ANIME_WATCHER_RELEASE=1: esas copias no se
# compilan solas desde main, sino que avisan de cada release nuevo y abren su página.
#
# Los instaladores no van firmados: en macOS hay que abrir la app con clic derecho → Abrir la
# primera vez, y en Windows aceptar el aviso de SmartScreen (Más información → Ejecutar de todas formas).
name: Publicar release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Comprobar versión
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión de tauri.conf.json (v$version)."
            exit 1
          fi

      - name: Crear el release (o reutilizar el que ya exista)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Anime Watcher $TAG" --notes-file - <<'EOF'
          ## Descargas

          | Sistema | Archivo |
          |---|---|
          | **Windows** | `Anime.Watcher_*_x64-setup.exe` (o el `.msi`) |
          | **Mac con Apple Silicon** (M1 o posterior) | `Anime.Watcher_*_aarch64.dmg` |
          | **Mac con Intel** | `Anime.Watcher_*_x64.dmg` |

          Los instaladores no están firmados:
          - **Mac:** arrastra la app a Aplicaciones y ábrela la primera vez con clic derecho → **Abrir**.
          - **Windows:** si aparece SmartScreen, pulsa **Más información → Ejecutar de todas formas**.

          Esta copia avisa cuando hay un release nuevo. Si prefieres que se compile y actualice sola
          desde `main`, instálala con el comando del [README](https://github.com/evilrender23/Anime-Watcher#instalación).
          EOF
          fi
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    env:
      ANIME_WATCHER_RELEASE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.args }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # El release ya existe (lo crea el trabajo "version"): así los tres trabajos no
          # intentan crearlo a la vez.
          releaseId: ${{ needs.version.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}
