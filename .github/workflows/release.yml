# Compila Anime Watcher para Windows, macOS (Apple Silicon e Intel) y Linux y publica
# una release en GitHub con los instaladores y el latest.json que usa el actualizador
# automático de la app.
#
# Se lanza al subir una etiqueta vX.Y.Z (o a mano desde la pestaña Actions). La versión
# publicada es la de src-tauri/tauri.conf.json, así que súbela antes de etiquetar.
#
# Pasos:
#   1. prepare  → crea la release como borrador (o reutiliza el borrador existente).
#   2. build    → compila cada sistema en paralelo y sube instaladores y firmas (.sig).
#   3. publish  → genera UN latest.json con todas las plataformas y publica la release.
# Así latest.json no se pisa entre trabajos paralelos y sólo aparece cuando la release
# está completa (releases/latest/download/latest.json no ve los borradores).
#
# Secretos (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           obligatorio: contenido de ~/.tauri/anime-watcher.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  sólo si esa clave tiene contraseña
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Preparar release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la clave de firma
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Falta el secreto TAURI_SIGNING_PRIVATE_KEY. Sin él no se pueden firmar las actualizaciones."
            exit 1
          fi

      - name: Versión
        id: meta
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con la versión de tauri.conf.json (v$version)."
            exit 1
          fi

      - name: Crear borrador
        id: release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          id="$(gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)"
          if [ -z "$id" ]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Anime Watcher $TAG" --notes-file - <<'EOF'
          **Windows** (PowerShell): `irm https://raw.githubusercontent.com/evilrender23/Anime-Watcher/main/scripts/install.ps1 | iex`
          **macOS / Linux**: `curl -fsSL https://raw.githubusercontent.com/evilrender23/Anime-Watcher/main/scripts/install.sh | bash`

          También puedes descargar el instalador de tu sistema más abajo. Si ya tienes la app, se actualiza sola.
          EOF
            id="$(gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.args }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # latest.json lo genera el trabajo "publish" con todas las plataformas.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  publish:
    name: Publicar
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Todo por id de release: el borrador todavía no es visible por etiqueta.
      - name: Generar latest.json
        env:
          ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p sigs
          gh api "repos/$GH_REPO/releases/$ID/assets" --paginate --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
            while read -r asset_id name; do
              gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$asset_id" > "sigs/$name"
            done
          ls -1 sigs
          python3 scripts/updater-json.py "$VERSION" "Anime Watcher $TAG" \
            "https://github.com/$GH_REPO/releases/download/$TAG" sigs latest.json
          cat latest.json

      - name: Subir latest.json
        env:
          ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          old="$(gh api "repos/$GH_REPO/releases/$ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')"
          if [ -n "$old" ]; then gh api -X DELETE "repos/$GH_REPO/releases/assets/$old"; fi
          gh api -X POST -H "Content-Type: application/json" --input latest.json \
            "https://uploads.github.com/repos/$GH_REPO/releases/$ID/assets?name=latest.json" --jq .browser_download_url

      - name: Publicar la release
        env:
          ID: ${{ needs.prepare.outputs.release_id }}
        run: gh api -X PATCH "repos/$GH_REPO/releases/$ID" -F draft=false -f make_latest=true --jq .html_url
