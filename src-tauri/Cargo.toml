[package]
name = "anime-watcher"
version = "1.0.0"
description = "Anime Watcher: ver animé subtitulado al español, con interfaz gráfica para Windows, macOS y Linux."
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/evilrender23/Anime-Watcher"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "gzip", "brotli", "deflate", "cookies", "form", "json", "query", "stream"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
scraper = "0.29"
regex = "1"
base64 = "0.23"
url = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
which = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
